<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Industries</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="media.css">
</head>
<body>
    <div data-include="header.html" class="header-container"></div>

    <main>
        <div class="page-header">
            <h1 id="lab-title">Loading...</h1>
        </div>

        <div id="catalog-container" class="catalogue-grid">
            <div class="catalogue-layout">
                
                <div class="catalogue-details">
                    <h3>Lab Information</h3>
                    <div id="lab-details"></div>
                    <a id="download-catalogue" class="download-link" href="#">Download Catalogue</a>
                </div>
                
                <div class="catalogue-panel">
                    <iframe id="catalogue-frame" title="Catalogue Preview" class="catalogue-frame"></iframe>
                </div>
                
            </div>
        </div>
    </main>
    <div data-include="footer.html"></div>
</body>
<script src="app.js"></script>
</html>
